<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pearl Tingxie">
<meta name="theme-color" content="#E7F6F7">
<title>Pearl Tingxie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column in the Mermaid Times lagoon look; Chinese is drawn in kaishu stroke data so it matches how she is taught to write. Single light look on purpose. */
:root{
  color-scheme: light;
  --lagoon:#E7F6F7; --card:#FFFFFF; --grid:#E7B9C8;
  --ink:#123B57; --ink-soft:#3F6178;
  --teal:#0E7480; --teal-deep:#0A5660; --foam:#C6EEE8; --foam-ink:#0A5660;
  --coral:#C9452F; --coral-deep:#8E2E1F; --coral-tint:#FDE3DC;
  --sand:#FFF1D6; --sand-ink:#7A5A12; --gold:#F2B630;
  --pearl:#F7D6E0; --pearl-ink:#8C2F5A; --lilac:#6D4BB8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --han:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Noto Sans SC",serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--lagoon);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-inline:16px;padding-block:16px 20px;display:flex;flex-direction:column;gap:12px}
.app>*{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{flex:1;margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}
.icon-btn{border:0;cursor:pointer;width:44px;height:44px;flex-shrink:0;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center}
.pill{background:var(--card);border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px;font-weight:800}
.muted{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.45}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--teal)}
.brand .zh{font-family:var(--han);font-size:22px;color:var(--pearl-ink)}
.brand p{margin:0;color:var(--ink-soft);font-size:15px}
.label{font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;cursor:pointer;padding:8px 12px;border-radius:16px;background:var(--lagoon);font-weight:800;font-size:14px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip.on{background:var(--teal);color:#fff}
.chip small{font-size:11px;font-weight:700;opacity:.85}
.seg{display:flex;background:var(--lagoon);border-radius:20px;padding:4px;gap:2px}
.seg button{border:0;cursor:pointer;flex:1;min-height:42px;border-radius:16px;background:transparent;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.menu{border:0;cursor:pointer;text-align:left;width:100%;background:var(--card);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--foam)}
.menu .ico{width:50px;height:50px;border-radius:16px;background:var(--foam);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--han);font-size:28px;color:var(--teal-deep)}
.menu .txt{flex:1;display:flex;flex-direction:column;min-width:0}
.menu .name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.menu .desc{font-size:14px;color:var(--ink-soft)}
.menu.teal{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-deep)}
.menu.teal .ico{background:#fff}
.menu.teal .desc{color:#D9F3F1}
.menu.pink{box-shadow:0 5px 0 #F3C4D0}
.menu.pink .ico{background:var(--pearl);color:var(--pearl-ink)}
.btn{border:0;cursor:pointer;min-height:50px;border-radius:18px;background:var(--card);font-weight:800;font-size:15px;color:var(--teal-deep);display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:0 12px}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep)}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-deep)}
.btn.soft{background:var(--foam);color:var(--foam-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-row{display:flex;gap:10px}
.link-btn{color:var(--teal);font-weight:800;font-size:14px;padding:10px 16px;align-self:center;text-decoration:none}

/* card */
.prog{display:flex;gap:3px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--foam)}
.prog i.ok{background:var(--teal)} .prog i.fix{background:var(--gold)} .prog i.miss{background:var(--coral)} .prog i.now{background:var(--ink)}
.prompt{background:var(--card);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--foam);position:relative}
.prompt .ask{font-weight:800;font-size:14px;color:var(--ink-soft)}
.prompt .py{font-family:var(--body);font-weight:800;font-size:34px;letter-spacing:1px;text-align:center;line-height:1.2}
.prompt .han{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.badge{position:absolute;right:12px;top:10px;font-size:11px;font-weight:800;background:var(--sand);color:var(--sand-ink);border-radius:10px;padding:3px 8px}
.say{border:0;cursor:pointer;width:44px;height:44px;border-radius:22px;background:var(--foam);display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:10px;justify-content:center}

/* writing characters */
.slots{display:flex;gap:6px;justify-content:center}
.slot{width:46px;height:46px;border-radius:10px;border:2px dashed #B9CAD3;background:var(--card);box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot.now{border:2px solid var(--teal)}
.slot.done{border:2px solid var(--teal);background:#EAF7F5}
.slot.fix{border:2px solid var(--gold);background:var(--sand)}
.slot.shown{border:2px solid var(--coral);background:var(--coral-tint)}
.slot.given{border:2px solid #DDE5EA;background:#F3F6F8}
.pad-wrap{display:flex;justify-content:center}
.pad{position:relative;background:var(--card);border-radius:18px;border:3px solid var(--grid);touch-action:none}
.pad svg.gridlines{position:absolute;inset:0;pointer-events:none}
.pad .w{position:relative}
.fb{border-radius:18px;padding:11px 14px;font-size:15px;line-height:1.45}
.fb.ok{background:#D7F0EC;color:var(--foam-ink)}
.fb.no{background:var(--coral-tint);color:var(--coral-deep)}
.fb.tip{background:var(--sand);color:var(--sand-ink)}
.fb b{font-weight:800}
.fb .ans{font-family:var(--han);font-size:20px}

/* pinyin input */
.syls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.syl{border:3px solid #B9CAD3;background:var(--card);border-radius:14px;min-width:64px;height:58px;padding:0 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.syl.now{border-color:var(--teal);box-shadow:0 0 0 4px var(--foam)}
.syl.ok{border-color:var(--teal);background:var(--teal);color:#fff}
.syl.bad{border-color:var(--coral);background:var(--coral-tint)}
.syl.shown{border-color:var(--gold);background:var(--sand)}
.syl .han1{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-family:var(--han);font-size:13px;background:var(--lagoon);border-radius:8px;padding:0 5px;color:var(--ink-soft)}
.lt{border:0;background:transparent;padding:0 1px;font-family:var(--body);font-weight:800;font-size:30px;line-height:1;cursor:pointer;color:inherit;border-bottom:3px solid transparent}
.lt.sel{border-bottom-color:var(--coral)}
.syl.ok .lt.sel{border-bottom-color:transparent}
.caret{display:inline-block;width:2px;height:28px;background:var(--teal);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{border:0;cursor:pointer;height:44px;flex:1;max-width:38px;border-radius:9px;background:var(--card);box-shadow:0 3px 0 var(--foam);font-weight:800;font-size:19px;padding:0}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--foam)}
.kb .tone{max-width:none;font-size:15px;background:var(--pearl);box-shadow:0 3px 0 #EDB9C8;color:var(--pearl-ink)}
.kb .tone b{font-size:22px;display:block;line-height:.8}
.kb .wide{max-width:none;font-size:14px}
.kb .go{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-deep)}
.kb .del{background:var(--pearl);box-shadow:0 3px 0 #EDB9C8}

/* results / lists */
.res{align-items:center;text-align:center}
.res h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--teal);margin:0}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;width:100%}
.li{background:var(--card);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:10px;text-align:left}
.li .w{font-family:var(--han);font-size:22px;min-width:70px}
.li .p{flex:1;font-weight:700;color:var(--ink-soft)}
.li .m{font-weight:800;font-size:13px;border-radius:10px;padding:3px 8px}
.m.ok{background:#D7F0EC;color:var(--foam-ink)} .m.fix{background:var(--sand);color:var(--sand-ink)} .m.miss{background:var(--coral-tint);color:var(--coral-deep)}
.dirtag{font-size:12px;font-weight:800;color:var(--ink-soft)}
.lessons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lessons .chip{min-height:58px;padding:6px 2px}
.meter{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.5);overflow:hidden}
.chip:not(.on) .meter{background:#D4E6EA}
.meter i{display:block;height:100%;background:var(--gold)}
/* read-aloud tingxie */
.dict{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.dict .num{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--teal)}
.dict .what{font-weight:800;font-size:20px;border-radius:16px;padding:10px 18px}
.dict .what.hz{background:var(--pearl);color:var(--pearl-ink)}
.dict .what.py{background:var(--foam);color:var(--foam-ink)}
.dict .what.st{background:var(--sand);color:var(--sand-ink)}
.dict .what span{font-family:var(--han);font-size:22px;margin-left:6px}
.dict .boxes{display:flex;gap:8px}
.dict .bx{width:44px;height:44px;border:2px solid #B9CAD3;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#7B8B96;box-sizing:border-box}
.dict .bx.skip{border-style:dashed;background:#F3F6F8}
.bigsay{border:0;cursor:pointer;width:84px;height:84px;border-radius:42px;background:var(--teal);box-shadow:0 5px 0 var(--teal-deep);display:flex;align-items:center;justify-content:center}
.sheet-row{background:var(--card);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.sheet-row .n{font-weight:800;color:var(--ink-soft);min-width:24px}
.sheet-row .a{flex:1;text-align:left}
.sheet-row .a .w{font-family:var(--han);font-size:22px}
.sheet-row .a .p{font-weight:700;color:var(--ink-soft);font-size:14px}
.sheet-row .a .k{font-size:12px;font-weight:800;color:var(--ink-soft)}
.mk{border:0;cursor:pointer;width:44px;height:44px;border-radius:12px;background:var(--lagoon);font-weight:800;font-size:18px}
.mk.on.ok{background:var(--teal);color:#fff}
.mk.on.no{background:var(--coral);color:#fff}
.sec{font-weight:800;font-size:13px;letter-spacing:1px;color:var(--ink-soft);margin-top:4px}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const TONED = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
const UNTONE = {}; Object.entries(TONED).forEach(([b, s]) => [...s].forEach((c, i) => UNTONE[c] = [b, i + 1]));
function parseSyl(s){ let base = '', tone = 0, at = -1; [...s].forEach((c, i) => { if (UNTONE[c]){ base += UNTONE[c][0]; tone = UNTONE[c][1]; at = i; } else base += c; }); return {base, tone, at}; }
function toned(ch, t){ return t && TONED[ch] ? TONED[ch][t - 1] : ch; }
function sylText(s){ return s.letters.map((c, i) => i === s.at ? toned(c, s.tone) : c).join(''); }
function markVowel(base){ /* where the tone mark goes: a/e first, then o in ou, else last vowel */
  if (base.includes('a')) return 'a'; if (base.includes('e')) return 'e'; if (base.includes('ou')) return 'o';
  const v = [...base].filter(c => 'iouü'.includes(c)); return v.length ? v[v.length - 1] : '';
}

function trickyCards(lessons){
  const out = [];
  ITEMS.filter(it => !lessons || lessons.includes(it.l)).forEach(it => dirsOf(it).forEach(dir => { const s = D.stats[sk(it, dir)]; if (s && s.tricky) out.push({it, dir, s}); }));
  return out.sort((a, b) => b.s.last - a.s.last);
}
function dirsOf(it){ return it.test === 'stroke' ? ['stroke'] : ['hz', 'py']; }
function buildPractice(){
  const pool = []; inLessons().forEach(it => dirsOf(it).forEach(dir => pool.push({it, dir})));
  const tricky = shuffle(pool.filter(c => D.stats[sk(c.it, c.dir)]?.tricky)).slice(0, 5);
  const unseen = shuffle(pool.filter(c => !D.stats[sk(c.it, c.dir)]));
  const rest = shuffle(pool.filter(c => D.stats[sk(c.it, c.dir)] && !D.stats[sk(c.it, c.dir)].tricky));
  const pick = []; const seen = new Set();
  [...tricky, ...unseen, ...rest].forEach(c => { if (pick.length < 12 && !seen.has(sk(c.it, c.dir))){ seen.add(sk(c.it, c.dir)); pick.push(c); } });
  return spread(shuffle(pick));
}
function spread(cards){ /* avoid the same word twice in a row */
  for (let i = 1; i < cards.length; i++) if (cards[i].it.id === cards[i-1].it.id){ const j = cards.findIndex((c, k) => k > i && c.it.id !== cards[i-1].it.id); if (j > 0) [cards[i], cards[j]] = [cards[j], cards[i]]; }
  return cards;
}

/* ---------- writer (characters and strokes) ---------- */
function padSize(){ return Math.min(280, window.innerWidth - 80); }
function gridSvg(n){ return `<svg class="gridlines" width="${n}" height="${n}" aria-hidden="true"><g stroke="#E7B9C8" stroke-width="1.5" stroke-dasharray="6 6"><line x1="0" y1="${n/2}" x2="${n}" y2="${n/2}"/><line x1="${n/2}" y1="0" x2="${n/2}" y2="${n}"/><line x1="0" y1="0" x2="${n}" y2="${n}"/><line x1="${n}" y1="0" x2="0" y2="${n}"/></g></svg>`; }
function mountWriter(){
  const pad = $('pad'); if (!pad || !window.HanziWriter) return;
  const n = padSize(); pad.style.width = n + 'px'; pad.style.height = n + 'px';
  pad.innerHTML = gridSvg(n) + '<div class="w" id="w"></div>';
  const ch = C.dir === 'stroke' ? C.it.ex : C.chars[C.ci].ch;
  writer = HanziWriter.create('w', ch, {width:n, height:n, padding:14, showCharacter:false, showOutline: C.dir === 'stroke' ? true : D.outline, outlineColor:'#E3EAEE',
    strokeColor:'#123B57', highlightColor:'#2FA3A8', drawingColor:'#0E7480', drawingWidth:7, showHintAfterMisses:3, highlightOnComplete:true,
    leniency:1.3, charDataLoader:loader, renderer:'svg'});
  C.charMistakes = 0;
  if (C.dir === 'stroke'){
    const k = C.it.k;
    writer.quiz({quizStartStrokeNum:k, onMistake: () => { C.mistakes++; }, onCorrectStroke: d => { if (d.strokeNum === k){ writer.cancelQuiz(); writer.showCharacter(); finishCard(C.mistakes <= 2 ? 'right' : 'fixed'); } }});
  } else {
    writer.quiz({onMistake: () => { C.charMistakes++; C.mistakes++; }, onComplete: s => { charDone(C.charMistakes <= 2 ? 'done' : 'fix'); }});
  }
}
function charDone(how){
  C.cstat[C.ci] = how;
  const next = C.chars.findIndex((x, k) => k > C.ci && !x.given);
  if (next >= 0){ C.ci = next; setTimeout(() => { render(); mountWriter(); }, 350); return; }
  const anyShown = C.cstat.includes('shown'), anyFix = C.cstat.includes('fix');
  setTimeout(() => finishCard(anyShown ? 'shown' : anyFix ? 'fixed' : 'right'), 350);
}
function showMe(){
  if (C.dir === 'py'){
    C.ans = C.exp[0].map(e => ({letters:[...e.base], tone:e.tone, at:e.at}));
    finishCard('shown'); return;
  }
  if (!writer) return;
  writer.cancelQuiz();
  if (C.dir === 'stroke'){ writer.hideCharacter(); writer.animateCharacter({onComplete: () => finishCard('shown')}); return; }
  writer.animateCharacter({onComplete: () => { C.cstat[C.ci] = 'shown'; const next = C.chars.findIndex((x, k) => k > C.ci && !x.given);
    if (next >= 0){ C.ci = next; render(); mountWriter(); } else finishCard('shown'); }});
}
function hint(){
  if (!writer) return;
  C.mistakes++; C.charMistakes = (C.charMistakes || 0) + 1;
  if (C.dir === 'stroke'){ writer.highlightStroke(C.it.k); return; }
  /* briefly show the outline, then hide it again */
  writer.showOutline();
  setTimeout(() => { if (writer && !D.outline && C.dir !== 'stroke') writer.hideOutline(); }, 1500);
}

/* ---------- pinyin typing ---------- */
const VOWELS = 'aeiouü';
function pyKey(act, arg){
  if (C.status !== 'todo') return;
  const s = C.ans[C.s];
  C.msg = ''; C.bad = C.bad.filter(k => k !== C.s);
  if (act === 'letter'){
    if (s.letters.length >= 6) return;
    s.letters.push(arg); C.sel = s.letters.length - 1;
  } else if (act === 'bk'){
    if (!s.letters.length){ if (C.s > 0){ C.s--; C.sel = C.ans[C.s].letters.length - 1; } }
    else { const gone = s.letters.length - 1; s.letters.pop(); if (s.at === gone){ s.at = -1; s.tone = 0; } C.sel = s.letters.length - 1; }
  } else if (act === 'tone'){
    const t = +arg;
    if (t === 0){ s.tone = 0; s.at = -1; }
    else {
      const i = C.sel >= 0 && C.sel < s.letters.length ? C.sel : -1;
      if (i < 0 || !VOWELS.includes(s.letters[i])){
        const mv = markVowel(s.letters.join(''));
        C.msg = `<b>Tap the letter that gets the mark first.</b> Tone marks sit on a vowel: a, o, e, i, u or ü.${mv ? '' : ''}`; C.msgOk = true;
      } else { s.tone = t; s.at = i; }
    }
  } else if (act === 'nextsyl'){
    if (C.s < C.ans.length - 1){ C.s++; C.sel = C.ans[C.s].letters.length - 1; }
  }
  render();
}
function checkPy(){
  if (C.ans.some(s => !s.letters.length)){ C.tries = Math.max(C.tries, 1); C.msg = '<b>Fill in every syllable first.</b> Tap a box to move to it, or tap Show me.'; C.msgOk = true; render(); return; }
  /* compare with each accepted spelling and keep the closest */
  let best = null;
  C.exp.forEach(exp => {
    const res = exp.map((e, k) => {
      const a = C.ans[k], letters = a.letters.join('');
      if (letters !== e.base) return 'letters';
      if (a.tone !== e.tone) return 'tone';
      if (e.tone && a.at !== e.at) return 'place';
      return 'ok';
    });
    const bad = res.filter(r => r !== 'ok').length;
    if (!best || bad < best.bad) best = {res, bad, exp};
  });
  C.tries++;
  if (!best.bad){ finishCard(C.tries === 1 ? 'right' : 'fixed'); return; }
  C.bad = best.res.map((r, k) => r === 'ok' ? -1 : k).filter(k => k >= 0);
  const k = C.bad[0], r = best.res[k], e = best.exp[k], ch = chars(C.it)[k].ch;
  C.s = k; C.sel = C.ans[k].letters.length - 1;
  C.msg = r === 'letters' ? `<b>Look at the letters for <span style="font-family:var(--han)">${esc(ch)}</span>.</b> Say it slowly and listen for each sound.`
        : r === 'tone' ? (e.tone === 0 ? `<b><span style="font-family:var(--han)">${esc(ch)}</span> is said lightly.</b> It has no tone mark.` : `<b>Letters are right for <span style="font-family:var(--han)">${esc(ch)}</span>!</b> Check the tone: is it ˉ ˊ ˇ or ˋ?`)
        : `<b>Right tone for <span style="font-family:var(--han)">${esc(ch)}</span>!</b> But the mark goes on the <b>${esc(markVowel(e.base))}</b>.`;
  C.msgOk = false;
  render();
}

/* ---------- finishing ---------- */
function finishCard(status){
  if (C.status !== 'todo') return;
  C.status = status;
  const it = C.it, k = sk(it, C.dir), s = stat(k), today = dayKey();
  s.seen++; s.last = Date.now();
  if (status === 'right'){
    s.right++; s.streak++;
    if (s.tricky){ if (!s.catchDays.includes(today)) s.catchDays.push(today); if (s.streak >= 2 && s.catchDays.length >= 2){ s.tricky = false; s.catchDays = []; } }
  } else { s.wrong++; s.streak = 0; s.tricky = true; s.catchDays = []; }
  const r = D.days[today] || (D.days[today] = {cards:0}); r.cards++;
  SES.res.push({it, dir:C.dir, mark: status === 'right' ? 'ok' : status === 'fixed' ? 'fix' : 'miss'});
  save();
  writer = null;
  render();
  if (C.dir === 'hz' || C.dir === 'py') setTimeout(() => say(plain(it)), 200);
}
function nextCard(){
  if (SES.i < SES.cards.length - 1){ SES.i++; openCard(); }

  return `<div class="app res" style="padding:8px 0 0;flex:1;gap:12px">
    ${I.pearl(96)}
    <h1>${mock ? SES.title + ' done!' : ok === n ? 'Pearl-fect!' : 'Lovely work!'}</h1>
    <div class="big">${ok} / ${n}</div>
    <p class="muted">${mock ? 'right first time, like the real test' : 'right first time'}</p>
    <div class="list">${r.map(x => `<div class="li"><span class="w">${esc(x.dir === 'stroke' ? x.it.w : plain(x.it))}</span><span class="p">${esc(x.dir === 'stroke' ? x.it.py : pyMain(x.it))}<br><span class="dirtag">${x.dir === 'hz' ? 'wrote the word' : x.dir === 'py' ? 'wrote the pinyin' : 'stroke'}</span></span><span class="m ${x.mark}">${x.mark === 'ok' ? 'Right' : x.mark === 'fix' ? 'Fixed' : 'Learning'}</span></div>`).join('')}</div>
    <div class="btn-row" style="width:100%;margin-top:auto">
      <button class="btn" data-act="go" data-arg="home">Home</button>
      ${r.some(x => x.mark !== 'ok') ? `<button class="btn coral" data-act="redo" style="flex:1.4">Try the misses again</button>` : `<button class="btn coral" data-act="${mock ? 'mock' : 'practice'}" data-arg="${mock ? D.mockL || 19 : ''}" style="flex:1.4">Again</button>`}
    </div>
  </div>`;
}

/* ---------- render ---------- */
const VIEWS = {home:homeView, card:cardView, tricky:trickyView, results:resultsView, dict:dictView, sheet:sheetView};
function render(){ $('app').innerHTML = VIEWS[screen](); fillStatics(); }
function go(s){ const c = s !== screen; screen = s; render(); if (c) window.scrollTo(0, 0); if (s === 'card' && C && C.status === 'todo' && (C.dir === 'stroke' || (C.dir === 'hz' && !D.paper))) mountWriter(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, arg = t.dataset.arg;
  switch (a){
    case 'go': go(arg); break;
    case 'lesson': { const l = +arg; D.lessons = D.lessons.includes(l) ? D.lessons.filter(x => x !== l) : D.lessons.concat(l).sort(); save(); render(); break; }
    case 'mockl': D.mockL = +arg; save(); render(); break;
    case 'paper': D.paper = arg === '1'; save(); render(); break;
    case 'outline': D.outline = arg === '1'; save(); render(); break;
    case 'practice': if (D.lessons.length) startSession('practice', buildPractice(), 'Practice'); break;
    case 'mock': D.mockL = +arg || D.mockL || 19; save(); startMock(D.mockL); break;
    case 'dictl': D.dictL = +arg; save(); render(); break;
    case 'dictway': D.dictWay = arg; save(); render(); break;
    case 'dictchars': D.dictChars = arg === '1'; save(); render(); break;
    case 'dictstart': startDict(); break;
    case 'dictsay': sayTwice(dictText(DT.cards[DT.i])); break;
    case 'dictnext': if (DT.i < DT.cards.length - 1){ DT.i++; render(); sayTwice(dictText(DT.cards[DT.i])); } else { clearTimeout(sayTimer); try { speechSynthesis.cancel(); } catch(_){} go('sheet'); } break;
    case 'dictprev': if (DT.i > 0){ DT.i--; render(); sayTwice(dictText(DT.cards[DT.i])); } break;
    case 'dictquit': clearTimeout(sayTimer); try { speechSynthesis.cancel(); } catch(_){} go('home'); break;
    case 'dictagain': DT.i = 0; go('dict'); sayTwice(dictText(DT.cards[0])); break;
    case 'mark': { const [k, m] = arg.split(','); DT.marks[k] = DT.marks[k] === m ? undefined : m; if (DT.marks[k] === undefined) delete DT.marks[k]; DT.saved = false; render(); break; }
    case 'dictsave': saveDictMarks(); break;
    case 'trickygo': startSession('practice', spread(shuffle(trickyCards().map(c => ({it:c.it, dir:c.dir})))).slice(0, 12), 'Tricky words'); break;
    case 'redo': startSession('practice', SES.res.filter(x => x.mark !== 'ok').map(x => ({it:x.it, dir:x.dir})), 'Try again'); break;
    case 'quit': try { speechSynthesis.cancel(); } catch(_){} writer = null; go('home'); break;
    case 'say': say(C.dir === 'stroke' ? C.it.w : plain(C.it)); break;
    case 'next': nextCard(); break;
    case 'hint': hint(); break;
    case 'showme': showMe(); break;
    case 'paperShow': C.paperStage = 'check'; render(); { const el = $('reveal'); C.chars.forEach((x, k) => { const d = document.createElement('button'); d.className = 'slot'; d.style.cssText = 'width:84px;height:84px;cursor:pointer;border-style:solid'; d.setAttribute('aria-label', x.ch); el.appendChild(d); const w = HanziWriter.create(d, x.ch, {width:80, height:80, padding:6, showOutline:true, strokeColor: x.given ? '#9DB0BC' : '#123B57', charDataLoader:loader, renderer:'svg', delayBetweenStrokes:150, strokeAnimationSpeed:1.2}); if (!x.given) setTimeout(() => w.animateCharacter(), 700 * k); d.addEventListener('click', () => w.animateCharacter()); }); } break;
    case 'paperMark': C.cstat = C.cstat.map(s => s === 'given' ? s : arg === 'ok' ? 'done' : 'shown'); finishCard(arg === 'ok' ? 'right' : 'shown'); break;
    case 'letter': case 'bk': case 'tone': case 'nextsyl': pyKey(a, arg); break;
    case 'pick': { if (C.status !== 'todo') break; const [k, i] = arg.split(',').map(Number); C.s = k; C.sel = i; e.stopPropagation(); render(); break; }
    case 'sylbox': if (C.status === 'todo'){ C.s = +arg; C.sel = C.ans[C.s].letters.length - 1; render(); } break;
    case 'check': checkPy(); break;
  }
});
document.addEventListener('keydown', e => {
  if (screen !== 'card' || !C || C.dir !== 'py' || C.status !== 'todo') return;
  if (/^[a-z]$/.test(e.key)){ e.preventDefault(); pyKey('letter', e.key); }
  else if (/^[0-4]$/.test(e.key)){ e.preventDefault(); pyKey('tone', e.key); }
  else if (e.key === 'Backspace'){ e.preventDefault(); pyKey('bk'); }
  else if (e.key === ' ' || e.key === 'Tab'){ e.preventDefault(); pyKey('nextsyl'); }
  else if (e.key === 'Enter'){ e.preventDefault(); checkPy(); }
});
render();
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
